<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>Parts of the blind finger project</title><desc>A training loop contains the world and the agent. The world sends a 3x3 touch to the agent, the agent sends a move back. The trained agent then feeds a results step that produces a plot and a GIF.</desc><style>text{font-family:-apple-system,Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.box{fill:#F1EFE8;stroke:#888780}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}</style><rect width="680" height="230" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="40" y="30" width="450" height="180" rx="16" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/><text class="th" x="60" y="56">Training loop</text><text class="ts" x="60" y="76">Play, score, update the agent</text><g class="node c-teal"><rect x="60" y="104" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="122" text-anchor="middle" dominant-baseline="central">World</text><text class="ts" x="150" y="140" text-anchor="middle" dominant-baseline="central">Returns a 3x3 touch</text></g><g class="node c-purple"><rect x="290" y="104" width="180" height="56" rx="8" stroke-width="0.5"/><text class="th" x="380" y="122" text-anchor="middle" dominant-baseline="central">Agent</text><text class="ts" x="380" y="140" text-anchor="middle" dominant-baseline="central">Returns guess and move</text></g><line x1="246" y1="122" x2="282" y2="122" class="arr" marker-end="url(#arrow)"/><line x1="284" y1="142" x2="248" y2="142" class="arr" marker-end="url(#arrow)"/><line x1="496" y1="132" x2="522" y2="132" class="arr" marker-end="url(#arrow)"/><g class="node c-gray"><rect x="530" y="104" width="110" height="56" rx="8" stroke-width="0.5"/><text class="th" x="585" y="122" text-anchor="middle" dominant-baseline="central">Results</text><text class="ts" x="585" y="140" text-anchor="middle" dominant-baseline="central">Plot and GIF</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>

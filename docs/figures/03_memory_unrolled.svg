<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>Agent unrolled over three touches</title><desc>Three columns for touch 1, 2 and 3. Each column has input, encoder, memory and heads stacked bottom to top. The memory of each touch passes its 128 values to the memory of the next touch; the first one starts from zero.</desc><style>text{font-family:-apple-system,Helvetica,Arial,sans-serif}.t{font-size:14px;fill:#2C2C2A}.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.box{fill:#F1EFE8;stroke:#888780}.c-teal>rect,.c-teal>circle,rect.c-teal,circle.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.th,.c-teal>.t{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-purple>rect,.c-purple>circle,rect.c-purple,circle.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.th,.c-purple>.t{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-gray>rect,rect.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}</style><rect width="680" height="400" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g class="c-purple"><rect x="95" y="40" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="170" y="62" text-anchor="middle" dominant-baseline="central">Guess, move</text></g><g class="c-purple"><rect x="285" y="40" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="360" y="62" text-anchor="middle" dominant-baseline="central">Guess, move</text></g><g class="c-purple"><rect x="475" y="40" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="550" y="62" text-anchor="middle" dominant-baseline="central">Guess, move</text></g><g class="c-teal"><rect x="95" y="120" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="138" text-anchor="middle" dominant-baseline="central">Memory h</text><text class="ts" x="170" y="158" text-anchor="middle" dominant-baseline="central">128 numbers</text></g><g class="c-teal"><rect x="285" y="120" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="360" y="138" text-anchor="middle" dominant-baseline="central">Memory h</text><text class="ts" x="360" y="158" text-anchor="middle" dominant-baseline="central">128 numbers</text></g><g class="c-teal"><rect x="475" y="120" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="138" text-anchor="middle" dominant-baseline="central">Memory h</text><text class="ts" x="550" y="158" text-anchor="middle" dominant-baseline="central">128 numbers</text></g><rect class="box" x="95" y="206" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="170" y="228" text-anchor="middle" dominant-baseline="central">Encoder</text><rect class="box" x="285" y="206" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="360" y="228" text-anchor="middle" dominant-baseline="central">Encoder</text><rect class="box" x="475" y="206" width="150" height="44" rx="8" stroke-width="0.5"/><text class="th" x="550" y="228" text-anchor="middle" dominant-baseline="central">Encoder</text><rect class="box" x="95" y="290" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="170" y="308" text-anchor="middle" dominant-baseline="central">Input</text><text class="ts" x="170" y="328" text-anchor="middle" dominant-baseline="central">12 numbers</text><rect class="box" x="285" y="290" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="360" y="308" text-anchor="middle" dominant-baseline="central">Input</text><text class="ts" x="360" y="328" text-anchor="middle" dominant-baseline="central">12 numbers</text><rect class="box" x="475" y="290" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="550" y="308" text-anchor="middle" dominant-baseline="central">Input</text><text class="ts" x="550" y="328" text-anchor="middle" dominant-baseline="central">12 numbers</text><line x1="170" y1="288" x2="170" y2="254" class="arr" marker-end="url(#arrow)"/><line x1="360" y1="288" x2="360" y2="254" class="arr" marker-end="url(#arrow)"/><line x1="550" y1="288" x2="550" y2="254" class="arr" marker-end="url(#arrow)"/><line x1="170" y1="204" x2="170" y2="180" class="arr" marker-end="url(#arrow)"/><line x1="360" y1="204" x2="360" y2="180" class="arr" marker-end="url(#arrow)"/><line x1="550" y1="204" x2="550" y2="180" class="arr" marker-end="url(#arrow)"/><line x1="170" y1="118" x2="170" y2="88" class="arr" marker-end="url(#arrow)"/><line x1="360" y1="118" x2="360" y2="88" class="arr" marker-end="url(#arrow)"/><line x1="550" y1="118" x2="550" y2="88" class="arr" marker-end="url(#arrow)"/><line x1="48" y1="148" x2="91" y2="148" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="64" y="134" text-anchor="middle">h = 0</text><line x1="247" y1="148" x2="281" y2="148" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="437" y1="148" x2="471" y2="148" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/><text class="ts" x="170" y="374" text-anchor="middle">Touch 1</text><text class="ts" x="360" y="374" text-anchor="middle">Touch 2</text><text class="ts" x="550" y="374" text-anchor="middle">Touch 3 ... 16</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
